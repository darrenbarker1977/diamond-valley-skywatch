name: Refresh official local weather
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: official-weather-cache
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate official Diamond Valley coordinate forecast
        run: python scripts/update-weather.py
      - name: Publish validated public forecast only
        run: |
          if git diff --quiet -- data/weather-diamond-valley.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/weather-diamond-valley.json
          git commit -m 'Refresh official Diamond Valley point forecast'
          git pull --rebase origin main
          git push origin HEAD:main
