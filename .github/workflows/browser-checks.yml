name: Skywatch checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: skywatch-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Phone, telescope and weather regression checks
        run: npx playwright test tests/finder-window.spec.js tests/context-help.spec.js tests/pointing.spec.js tests/field-ready.spec.js tests/equipment.spec.js tests/compass.spec.js tests/atlas.spec.js tests/forecast-targets.spec.js tests/night-mission.spec.js tests/location.spec.js tests/navigation.spec.js tests/main-menu.spec.js tests/live-entry.spec.js tests/field.spec.js tests/screen-awake.spec.js tests/scope-view.spec.js --workers=2 --reporter=line
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: skywatch-test-failures
          path: test-results/
          retention-days: 5
